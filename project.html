       nav {

    padding: 15px;
    border-radius: 10px;

    margin-bottom: 20px;
}

.box {

}

.box h2 {
    color: #694b70; 
}
    /* 1. 把“技能展示：”、“解决了什么问题：”改成稍浅的深紫色 + 楷体 */
strong {
    color: #7b1fa2 !important; /* 比标题略浅的深紫 */
    font-family: 'KaiTi', '楷体', serif !important; /* 强制换楷体 */
    font-size: 1.1em; /* 稍微放大一点，凸显标签感 */
}

/* 2. 把后面的小字正文改成浅紫色 + 宋体 */
p {
    color: #ab47bc !important; /* 偏浅的梦幻紫 */
    font-family: 'SimSun', '宋体', serif !important; /* 强制换宋体 */
    line-height: 1.8; /* 宋体配宽行距，文艺感拉满 */
